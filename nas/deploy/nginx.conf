server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 入口文件不缓存：index.html 无内容 hash，缓存旧版会导致新部署不生效
    location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # 带内容 hash 的资源长缓存（assets、播放器库）
    location /assets/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }
    location /js/     { expires 7d;  add_header Cache-Control "public"; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

    # 后端 API + 弹幕 WebSocket
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # 弹幕长连接
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

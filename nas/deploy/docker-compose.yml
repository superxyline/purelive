services:
  server:
    build:
      context: ../server
      dockerfile: ../deploy/Dockerfile.server
    restart: unless-stopped
    environment:
      - PORT=8080
      - NAS_MASTER_KEY=${NAS_MASTER_KEY:-}
      - LOG_LEVEL=info
      # 可选：环境变量方式注入各平台 cookie（大写平台名）
      # - PURE_LIVE_COOKIE_BILIBILI=SESSDATA=xxx;bili_jct=xxx;DedeUserID=xxx
    volumes:
      - ../data:/app/data
    expose:
      - "8080"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # 前端构建产物：cd nas/webui && npm run build 后把 dist/ 内容放进该目录
      - ../webui-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8090:80"
    depends_on:
      - server

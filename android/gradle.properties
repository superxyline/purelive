org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.socks.proxyHost=127.0.0.1
# systemProp.socks.proxyPort=7898
# AGP 9 Built-in Kotlin avoids a second Kotlin Gradle Plugin instance in the app and plugins.
android.builtInKotlin=true
# Keep the stable Android DSL while plugin compatibility is verified independently.
android.newDsl=false
# Flutter 3.47's generic KGP check rejects AGP's supported built-in compiler
# version. The repository audit below pins and validates the complete AGP/Gradle pair.
skipDependencyChecks=true
org.gradle.dependency.verification=off
org.gradle.warning.mode=none
# The Windows wrapper maps this long checkout to another drive. Kotlin's
# relocatable incremental cache rejects sources split between that drive and PUB_CACHE.
kotlin.incremental=false

# 禁用 Flutter 插件的默认 ABI 覆盖：其默认会把 x86_64/armeabi-v7a 与 arm64
# 一并打进 fat APK（多出约 69MB）。禁用后由 app/build.gradle.kts 的
# defaultConfig.ndk.abiFilters 决定打包哪些 ABI（默认仅 arm64-v8a，
# 可用 -PtargetAbi=x86_64,armeabi-v7a 覆盖，需与 --target-platform 配套）。
disable-abi-filtering=true

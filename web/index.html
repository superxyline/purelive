<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pure_live">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>纯粹直播 Web</title>
  <link rel="manifest" href="manifest.json">

  <!-- 直播流播放内核：HLS 用 hls.js，flv 直播流用 mpegts.js（本地 vendored，NAS 离线可用） -->
  <script src="js/hls.min.js"></script>
  <script src="js/mpegts.min.js"></script>
  <script>
    // pureLivePlayer：按 URL 类型选择播放内核，返回带 destroy() 的句柄
    window.pureLivePlayer = {
      attach: function (video, url) {
        var handle = { type: 'native', destroy: function () { video.removeAttribute('src'); try { video.load(); } catch (e) {} } };
        try {
          if (/\.m3u8(\?|$)/i.test(url) || /m3u8/i.test(url)) {
            if (window.Hls && window.Hls.isSupported()) {
              var hls = new window.Hls({ lowLatencyMode: true, backBufferLength: 30 });
              hls.loadSource(url);
              hls.attachMedia(video);
              handle.type = 'hls';
              handle.destroy = function () { try { hls.destroy(); } catch (e) {} };
              return handle;
            }
            // 不支持 MSE 时退回原生（Safari 可直接播 HLS）
            video.src = url;
            handle.type = 'native-hls';
            return handle;
          }
          if (/\.flv(\?|$)/i.test(url) && window.mpegts && window.mpegts.getFeatureList().mseLivePlayback) {
            var player = window.mpegts.createPlayer({ type: 'flv', isLive: true, url: url }, { enableStashBuffer: false, liveBufferLatencyChasing: true });
            player.attachMediaElement(video);
            player.load();
            handle.type = 'flv';
            handle.destroy = function () { try { player.pause(); player.unload(); player.detachMediaElement(); player.destroy(); } catch (e) {} };
            return handle;
          }
          video.src = url;
          return handle;
        } catch (e) {
          video.src = url;
          return handle;
        }
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
